[project]
name = "foodbot"
version = "0.1.0"
description = "Discord 食物照片熱量記錄 agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "discord.py>=2.4",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.scripts]
foodbot = "foodbot.main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foodbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
